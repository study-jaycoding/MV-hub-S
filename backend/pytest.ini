[pytest]
# 시험은 tests\ 안에만 있다. 이것을 고정하지 않으면 대상 없이 `pytest` 를 돌릴 때 backend
# 전체를 훑어서 두 가지가 깨진다.
#   · app\services\test_snapshot.py 는 시험이 아니라 제품 모듈인데 이름 때문에 수집된다.
#   · data_test\ 에 검증 도구가 남긴 소스 사본이 같은 이름의 모듈과 충돌해 수집이 통째로
#     멈춘다("import file mismatch" - 2026-09-14 실제로 전체 실행이 막혔다).
# 대상을 명시해 돌리는 기존 방식(`pytest tests`, tools\predeploy_gate.ps1)은 그대로 동작한다.
testpaths = tests

# data*\ 는 실행 중 만들어지는 DB·미디어·검증 산출물 자리다. 시험 코드는 없고, 큰 트리를
# 훑는 비용과 위 충돌만 생긴다. 앞의 넷은 pytest 기본값을 유지하려고 같이 적는다.
norecursedirs = .* build dist node_modules data data_test data_backup_* .data_test-incoming-* _pm_test_data_snapshots media
